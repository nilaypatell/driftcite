name: refresh

# The clock. Polls every tracked provider once a day, diffs anything that
# moved, and commits the result. The manifest history this produces is the
# asset; the code that produces it is not.
#
# Two deliberate details:
#   - state.json records today's date on every run, so there is always a commit
#     even on a quiet day. Scheduled workflows on public repos auto-disable
#     after 60 days without activity, and a daily commit is what keeps this one
#     alive.
#   - Everything runs in the open. For a product whose whole claim is "we cite
#     the provider instead of guessing", a pipeline anyone can audit is the
#     argument, not decoration.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: pip install --quiet pyyaml

      - name: Poll providers and diff what moved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scanner/refresh.py

      # The curated manifests are transcribed from prose pages. Watch the
      # pages they cite so an edit upstream becomes a work order, not rot.
      - name: Watch the cited documentation pages
        run: python3 scanner/watch_pages.py

      # A page says a model retired; the probe records that the ID actually
      # stopped being served. Providers whose key is not configured as a
      # secret are skipped by name.
      - name: Probe live model lists
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python3 scanner/probe_models.py

      # RFC 8594: an endpoint that sends Sunset is announcing its own death.
      # HEAD only, no keys, nothing templated.
      - name: Probe endpoints for sunset headers
        run: python3 scanner/probe_sunset.py

      - name: Rebuild the feed
        run: python3 scanner/build_feed.py

      - name: Commit the day
        run: |
          git config user.name "driftcite clock"
          git config user.email "77018379+nilaypatell@users.noreply.github.com"
          git add manifests/ feed/
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(feed): $(date -u +%Y-%m-%d) provider sweep"
            git push
          fi
