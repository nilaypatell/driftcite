name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is in the matrix on purpose: path handling bugs on Windows are
    # exactly the kind of thing that never shows up on the author's machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Commit identity
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/check_identity.sh origin/main..HEAD || true

      - name: Scanner tests
        run: node test/run.mjs

      # The hosted watch decides what gets pushed to other people's repos, so
      # its tests are not optional here.
      - name: Watch tests
        run: node test/watch.mjs

      # scanner/ is drift-free by construction, so this proves a clean run
      # end to end. The repo root is NOT expected to scan clean: the test
      # fixtures quote retired identifiers on purpose.
      - name: Smoke scan
        run: node bin/driftcite.mjs scanner --offline --no-deps

  feed-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pyyaml

      # The filters that decide what may become a finding. Both were added
      # after a false artifact shipped; neither is allowed to regress.
      - name: Artifact filters
        run: python3 scanner/openapi_diff.py --self-test

      - name: Observer logic
        run: |
          python3 scanner/probe_models.py --self-test
          python3 scanner/probe_sunset.py --self-test

      - name: Every recommended replacement must exist
        run: python3 scripts/verify_replacements.py

      - name: The feed must be in sync with the manifests
        run: |
          python3 scanner/build_feed.py
          if ! git diff --quiet feed/; then
            echo "feed/feed.json is stale. Run: python3 scanner/build_feed.py"
            git diff --stat feed/
            exit 1
          fi
