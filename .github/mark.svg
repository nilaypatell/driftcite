<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112">
  <!--
    driftcite mark: squared D, split and drifted. Set at 1:1 so it fills a
    square frame edge to edge; the drawing grid is the original 100x112,
    stretched by the outer transform.
  -->
  <g transform="scale(1.12 1)">
    <polygon fill="#3D5AFE" points="10,0 72,0 100,28 100,55 74,55 74,40 60,26 34,26 34,55 10,55"/>
    <polygon fill="#0D1220" points="0,57 24,57 24,86 50,86 64,72 64,57 90,57 90,84 62,112 0,112"/>
  </g>
</svg>
