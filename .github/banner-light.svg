<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="driftcite: find the API calls in your code that already stopped working">
  <defs>
    <style>
      .wordmark { font-family: 'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-weight: 800; }
      .sans     { font-family: 'Hanken Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; }
      .mono     { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,ui-monospace,monospace; }
    </style>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3D5AFE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3D5AFE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="#FFFBF8"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="17.5" fill="none" stroke="#EFE8DF"/>

  <!-- left column -->
  <text class="sans" x="72" y="78" font-size="13" font-weight="600" letter-spacing="2.6" fill="#5C6470">CROSS-VENDOR API DRIFT</text>

  <text class="wordmark" x="70" y="152" font-size="68" letter-spacing="-2.4" fill="#3D5AFE">driftcite</text>
  <rect x="72" y="172" width="300" height="3" rx="1.5" fill="url(#rule)"/>

  <text class="sans" x="72" y="221" font-size="23" font-weight="600" fill="#0F1419">Find the API calls in your code that</text>
  <text class="sans" x="72" y="253" font-size="23" font-weight="600" fill="#0F1419">already stopped working.</text>

  <text class="sans" x="72" y="290" font-size="16" fill="#5C6470">Every finding cites the provider who published the change.</text>

  <!-- terminal card -->
  <g transform="translate(700,58)">
    <rect x="0" y="0" width="430" height="224" rx="12" fill="#FFFFFF" stroke="#EFE8DF"/>
    <rect x="0" y="0" width="430" height="38" rx="12" fill="#F5EFE7"/>
    <rect x="0" y="26" width="430" height="12" fill="#F5EFE7"/>
    <circle cx="20" cy="19" r="4.5" fill="#FF5F57"/>
    <circle cx="36" cy="19" r="4.5" fill="#FEBC2E"/>
    <circle cx="52" cy="19" r="4.5" fill="#28C840"/>
    <line x1="0" y1="38" x2="430" y2="38" stroke="#EFE8DF"/>

    <text class="mono" x="22" y="70" font-size="13" fill="#5C6470">$ npx driftcite .</text>

    <text class="mono" x="22" y="107" font-size="12.5" fill="#6F7682">models.py:7</text>
    <text class="mono" x="22" y="130" font-size="13" fill="#0F1419">CHAT_MODEL = <tspan fill="#3D5AFE" font-weight="600">"gpt-4-turbo"</tspan></text>

    <rect x="20" y="148" width="176" height="26" rx="13" fill="#DCE3F3"/>
    <circle cx="35" cy="161" r="3.5" fill="#3D5AFE"/>
    <text class="mono" x="46" y="165.5" font-size="12" font-weight="600" fill="#3D5AFE">breaks in 88 days</text>

    <text class="mono" x="22" y="200" font-size="11.5" fill="#6F7682">evidence: openai deprecations</text>
  </g>
</svg>
