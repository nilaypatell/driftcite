<svg xmlns="http://www.w3.org/2000/svg" width="931" height="36" viewBox="0 0 931 36" role="img" aria-label="Apache 2.0 · 19 providers · 305 artifacts · zero dependencies · 118 tests passing · Node 18+">
  <defs>
    <style>
      /* Each label is one centred run rather than separately positioned words.
         Hardcoding x per word means guessing the font's metrics, and the guess
         is what pushed text into the right border last time. text-anchor
         middle balances the padding whatever the font actually measures. */
      .chip  { font-family: 'Hanken Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1px; }
      .value { fill: #3D5AFE; font-weight: 700; }
      .label { fill: #5C6470; }
      .dot   { font-size: 9px; }
    </style>
  </defs>

  <g>
    <rect x="0" y="0" width="136" height="36" rx="18" fill="#FFFFFF" stroke="#EFE8DF"/>
    <text class="chip" text-anchor="middle" x="68" y="22.5">
      <tspan class="dot" fill="#3D5AFE">●</tspan><tspan class="value" dx="7">Apache 2.0</tspan>
    </text>
  </g>

  <g>
    <rect x="148" y="0" width="124" height="36" rx="18" fill="#FFFFFF" stroke="#EFE8DF"/>
    <text class="chip" text-anchor="middle" x="210" y="22.5">
      <tspan class="value">19</tspan><tspan class="label" dx="5">providers</tspan>
    </text>
  </g>

  <g>
    <rect x="284" y="0" width="145" height="36" rx="18" fill="#FFFFFF" stroke="#EFE8DF"/>
    <text class="chip" text-anchor="middle" x="356.5" y="22.5">
      <tspan class="value">305</tspan><tspan class="label" dx="5">artifacts</tspan>
    </text>
  </g>

  <g>
    <rect x="441" y="0" width="177" height="36" rx="18" fill="#FFFFFF" stroke="#EFE8DF"/>
    <text class="chip" text-anchor="middle" x="529.5" y="22.5">
      <tspan class="value">zero</tspan><tspan class="label" dx="5">dependencies</tspan>
    </text>
  </g>

  <g>
    <rect x="630" y="0" width="183" height="36" rx="18" fill="#FFFFFF" stroke="#EFE8DF"/>
    <text class="chip" text-anchor="middle" x="721.5" y="22.5">
      <tspan class="dot" fill="#28A745">●</tspan><tspan class="value" dx="7">118</tspan><tspan class="label" dx="5">tests passing</tspan>
    </text>
  </g>

  <g>
    <rect x="825" y="0" width="106" height="36" rx="18" fill="#FFFFFF" stroke="#EFE8DF"/>
    <text class="chip" text-anchor="middle" x="878" y="22.5">
      <tspan class="label">Node</tspan><tspan class="value" dx="5">18+</tspan>
    </text>
  </g>
</svg>
