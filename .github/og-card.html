<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #FBFCFE;
    color: #0D1220;
    font-family: 'Hanken Grotesk', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .grid {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 1px 1px, #DBE0EA 1px, transparent 0) 0 0 / 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse 70% 80% at 78% 30%, #000 10%, transparent 78%);
  }
  .glow {
    position: absolute; right: -120px; top: -180px;
    width: 760px; height: 560px;
    background: radial-gradient(ellipse at center, rgba(61,90,254,.14) 0%, rgba(61,90,254,0) 68%);
  }
  .frame {
    position: absolute; inset: 0;
    padding: 68px 76px 62px;
    display: flex; flex-direction: column; justify-content: space-between;
    border-left: 10px solid #3D5AFE;
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 13px; font-family: 'Space Grotesk'; font-weight: 600; font-size: 30px; letter-spacing: -0.01em; }
  .kick {
    font-family: 'JetBrains Mono'; font-size: 16px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: #7A8299;
  }
  h1 {
    font-family: 'Space Grotesk'; font-weight: 700;
    font-size: 76px; line-height: 1.06; letter-spacing: -0.025em;
    max-width: 17ch; margin-top: 4px;
  }
  h1 .a { color: #3D5AFE; }
  .lede {
    font-size: 25px; line-height: 1.45; color: #414A61;
    max-width: 44ch; margin-top: 26px;
  }
  .bottom { display: flex; align-items: center; gap: 20px; }
  .cmd {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono'; font-size: 21px;
    background: #0E1119; color: #EDEFF7;
    border: 1px solid #2A3147; border-radius: 12px;
    padding: 14px 22px;
  }
  .cmd .p { color: #7C90FF; }
  .stat {
    font-family: 'JetBrains Mono'; font-size: 19px; color: #5C647B;
    letter-spacing: .01em;
  }
  .stat b { color: #0D1220; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="frame">
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 112 112" width="34" height="34">
          <g transform="scale(1.12 1)">
            <polygon fill="#3D5AFE" points="10,0 72,0 100,28 100,55 74,55 74,40 60,26 34,26 34,55 10,55"/>
            <polygon fill="#0D1220" points="0,57 24,57 24,86 50,86 64,72 64,57 90,57 90,84 62,112 0,112"/>
          </g>
        </svg>
        <span>driftcite</span>
      </div>
      <span class="kick">[ Apache-2.0 · open source ]</span>
    </div>

    <div>
      <h1>Catch dead API calls <span class="a">before your users do.</span></h1>
      <p class="lede">
        Static analysis for the model IDs, endpoints and parameters your
        dependency tools never look at.
      </p>
    </div>

    <div class="bottom">
      <span class="cmd"><span class="p">$</span> npx driftcite .</span>
      <span class="stat"><b>39.2%</b> of 449 scanned repositories are already calling one</span>
    </div>
  </div>
</body>
</html>
