<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="driftcite">
  <!--
    The app avatar: the driftcite mark (a squared D, split and drifted — the
    canonical source is mark.svg) centered on a transparent canvas. The D's
    two halves no longer meeting is the product: the provider moved, your
    code did not.
  -->
