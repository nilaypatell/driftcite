<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="driftcite">
  <!--
    The app avatar: the driftcite mark (a squared D, split and drifted; the
    canonical source is mark.svg) at full bleed. GitHub's badge places the
    whole square image inside a circular background, shrinking it to fit, so
    any padding baked into the file gets doubled on display. Zero padding
    here; GitHub provides the breathing room. The D's two halves no longer
    meeting is the product: the provider moved, your code did not.
  -->
  <g transform="translate(54.9 0) scale(9.1428)">
    <polygon fill="#002288" points="10,0 72,0 100,28 100,55 74,55 74,40 60,26 34,26 34,55 10,55"/>
    <polygon fill="#201e1d" points="0,57 24,57 24,86 50,86 64,72 64,57 90,57 90,84 62,112 0,112"/>
  </g>
</svg>
