provider: mistral
spec_version: 1
updated: 2026-08-06
sources:
  - https://docs.mistral.ai/getting-started/models/models_overview/

# Mistral publishes a "Deprecated & retired models" table in its model
# documentation with a deprecation date and a retirement date per model, and
# never in a machine-readable spec, so this file is curated by hand. Every
# date below is stated by the provider; every replacement is the API name the
# provider's own model card gives for the model the table points to.
#
# voxtral-mini-2507 appears twice in the provider's table (Voxtral Mini and
# Voxtral Mini Transcribe share the ID) and once here. open-mistral-7b is
# listed for each of its three weight versions and once here: the served ID
# is what code contains, and it is gone either way.
context:
  file_markers:
    - mistral
    - MISTRAL_API_KEY
    - api.mistral.ai

