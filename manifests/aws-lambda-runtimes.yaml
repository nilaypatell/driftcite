provider: aws
spec_version: 1
updated: 2026-08-07
sources:
  - https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html

# Lambda runtime retirement happens in three dated steps, quoted from the
# runtimes page: at deprecation "AWS may no longer apply security updates";
# then "Lambda begins blocking creation of new functions"; then "Lambda begins
# blocking the update of code and configuration for existing functions". After
# all of that, "you can continue to invoke your functions indefinitely" — so
# what a finding here means is that the deploy pipeline breaks on the
# block-update date, not that production calls stop. retires_on is that
# block-update date. AWS bulk-delayed most older runtimes' block dates to
# 2027-02-01 (create) and 2027-03-03 (update).
#
# Only runtimes already past their deprecation date are carried; flagging a
# runtime AWS still patches would teach people to mute the tool. The bare
# custom runtime id "provided" is left out because it is an ordinary English
# word, and dotnet7/dotnet5.0 are left out because they were container-only
# runtimes with no block dates.
context:
  file_markers:
    - aws
    - lambda

artifacts:
  - id: aws/runtime/nodejs20.x
    kind: runtime
    require_context: true
    match: { literals: ["nodejs20.x"] }
    status: deprecated
    retires_on: 2027-03-03
    severity: warning
    replacement: nodejs22.x
    note: >-
      Deprecated 2026-04-30; security updates may have stopped then. Function
      creation blocks 2027-02-01 and code/config updates block 2027-03-03;
      invocations continue.
    evidence: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html

