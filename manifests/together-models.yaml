provider: together
spec_version: 1
updated: 2026-08-07
sources:
  - https://docs.together.ai/docs/deprecations

# Together's deprecations page states removal dates only: "After the removal
# date, the model is no longer available via its serverless endpoint." Every
# artifact below is already past its date. Dedicated endpoints are unaffected,
# which the notes say, and the page names no per-model serverless replacement,
# so none is invented here.
#
# Every one of these ids is a HuggingFace-style org/model path that vLLM
# configs, relays and other hosts also use, so every artifact requires the
# file to name Together before it counts — the same rule that keeps Azure's
# resold model dates away from people calling the vendor directly.
#
# The page's fine-tuning removal table (2026-07-29, ~100 rows) is deliberately
# not carried: two of its named replacements are retired from serverless on
# the same page, and fine-tuning ids in application code are rare enough that
# the rows would be dead weight.
#
# Artifacts are grouped by removal date; the heading cites the date once and
# the literals list what died that day.
context:
  file_markers:
    - together
    - TOGETHER_API_KEY
    - api.together

artifacts:
  - id: together/model_id/serverless-removed-2026-08-04
    kind: model_id
    require_context: true
    match:
      literals: ["meta-llama/Llama-Guard-4-12B", "google/gemma-3n-E4B-it"]
    status: retired
    retires_on: 2026-08-04
    severity: warning
    note: >-
      Removed from Together serverless 2026-08-04. Dedicated endpoints are
      unaffected; Together's migration options are on the deprecations page.
    evidence: https://docs.together.ai/docs/deprecations

