provider: google
spec_version: 1
updated: 2026-08-06
sources:
  - https://ai.google.dev/gemini-api/docs/deprecations
  - https://ai.google.dev/gemini-api/docs/changelog

# Gemini model retirements are announced in the changelog and in the model
# documentation, never in a machine-readable spec, so this file is curated by
# hand. Every date below is stated by the provider.
#
# The two pages do different jobs. The changelog announces a shutdown and dates
# it; the deprecations page carries the "Recommended replacement" column, which
# is the only place Google states what to migrate to. Where they disagree the
# deprecations page wins, because it is the maintained table: the changelog
# entry of 2026-06-01 sent gemini-2.0-flash to gemini-3.5-flash, and the table
# now sends it to gemini-3.6-flash, released seven weeks after that entry.
#
# Google drops a model from the deprecations table once it is gone, so the
# Gemini 1.x models are listed on neither page with a replacement. Their
# shutdowns are citable in the changelog and their replacements are not, so they
# carry replacement: null and the CLI refuses to autofix them out loud.
context:
  file_markers:
    - gemini
    - GEMINI_API_KEY
    - GOOGLE_API_KEY
    - generativelanguage

artifacts:
  - id: google/model_id/gemini-1.0-pro
