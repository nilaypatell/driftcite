# Gemini model retirements are announced in the changelog and in the model
# documentation, never in a machine-readable spec, so this file is curated by
# hand. Every date below is stated by the provider.
context:
  file_markers:
    - gemini
    - GEMINI_API_KEY
    - GOOGLE_API_KEY
    - generativelanguage

