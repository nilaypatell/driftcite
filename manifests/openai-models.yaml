  # ---- the rest of the provider's shutdown tables ----
  # Everything below is a row of the same page, transcribed rather than
  # inferred. Two disciplines applied while reading it:
  #
  # A replacement that is itself scheduled to die is followed to the end of
  # the line. The page sent text-davinci-003 to gpt-3.5-turbo-instruct, and
  # sends gpt-3.5-turbo-instruct to gpt-5.6-terra on 2026-09-28: recommending
  # the middle of that chain would have rewritten dead code into code with
  # seven weeks left, and driftcite carried no artifact for it, so it could
  # never have flagged its own output. Both hops are stated on this one page.
  #
  # A model id that carries neither a digit nor a separator is skipped, for
  # the reason enum values are: `davinci`, `curie` and `babbage` are words
  # before they are models, and a quoted one is not evidence of a call.

