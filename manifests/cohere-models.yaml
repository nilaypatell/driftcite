provider: cohere
spec_version: 1
updated: 2026-08-06
sources:
  - https://docs.cohere.com/docs/deprecations

# Cohere publishes a dated deprecation history page, prose only, so this file
# is curated by hand. Every date and every replacement below is stated on that
# page.
#
# Two IDs the page deprecates are deliberately absent: the bare aliases
# "command" and "summarize". Both are ordinary English words that appear as
# quoted literals in codebases that have never called Cohere, and a wrong
# finding costs more than a missing one. The dated IDs and the hyphenated
# aliases cover the same retirements without the noise.
context:
  file_markers:
    - cohere
    - CO_API_KEY
    - COHERE_API_KEY
    - api.cohere

artifacts:
