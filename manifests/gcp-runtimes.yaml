provider: gcp
spec_version: 1
updated: 2026-08-07
sources:
  - https://docs.cloud.google.com/functions/docs/runtime-support

# Cloud Functions runtime ids have no dot and no .x — nodejs18, python39,
# go121 — which keeps every literal here distinct from the Lambda manifest's.
# The semantics, quoted from the runtime-support page: while deprecated "you
# can generally continue to create new workloads and update existing
# workloads"; once decommissioned "you can no longer create new workloads or
# update existing workloads using the runtime." retires_on is the
# decommission date, because that is the day deploys fail.
#
# Only runtimes already past their deprecation date are carried. dotnet6 is
# left out deliberately: Lambda's manifest owns that literal, and one literal
# carrying two providers' dates is the exact bug the build refuses. No
# replacement is named because the page names none per-runtime; the current
# supported list is on the same page.
context:
  file_markers:
    - gcloud
    - cloudfunctions
    - cloud-functions

artifacts:
  - id: gcp/runtime/nodejs20
    kind: runtime
    require_context: true
    match: { literals: ["nodejs20"] }
    status: deprecated
    retires_on: 2026-10-30
    severity: warning
    note: >-
      Deprecated 2026-04-30; decommissions 2026-10-30, after which deploys and
      updates of functions on this runtime fail.
    evidence: https://docs.cloud.google.com/functions/docs/runtime-support

  - id: gcp/runtime/nodejs18
    kind: runtime
    require_context: true
    match: { literals: ["nodejs18"] }
    status: retired
    retires_on: 2025-10-30
    severity: warning
    note: >-
      Deprecated 2025-04-30 and decommissioned 2025-10-30; deploys and updates
      of functions on this runtime fail.
    evidence: https://docs.cloud.google.com/functions/docs/runtime-support

