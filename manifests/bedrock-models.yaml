provider: bedrock
spec_version: 1
updated: 2026-08-06
sources:
  - https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle.html

# Bedrock model IDs are globally unique — nobody else serves
# anthropic.claude-3-haiku-20240307-v1:0 — so unlike the Azure manifest these
# need no file marker to be unambiguous. The distinction matters because AWS
# states it themselves on the page below: "Model lifecycle dates on this page
# are specific to Amazon Bedrock and may differ from dates published by model
# providers (such as Anthropic or Cohere). For Amazon Bedrock usage, only the
# dates on this page apply." The ID is what says which clock you are on.
#
# retires_on is the EOL date, when requests begin to fail. The Legacy date is
# recorded as announced_on: a Legacy model still answers, but new customers
# are turned away and existing ones can lose access after 15 days of
# inactivity, so it is the real warning shot.
#
# AWS publishes no replacement column, so every replacement here is null and
# --fix will refuse them out loud rather than invent a migration. The page
# also lists only models that are Legacy or pending EOL: anything already past
# its EOL date is dropped by AWS, so it cannot be cited from here and is
# deliberately absent.
context:
  file_markers:
    - bedrock
    - AWS_
    - boto3
    - amazonaws

