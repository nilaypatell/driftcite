provider: azure
spec_version: 1
updated: 2026-08-06
sources:
  - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
  - https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirements

# Azure resells other people's models under its own lifecycle, and its dates
# are not theirs. gpt-4o, claude-sonnet-4-5 and grok-4-fast-reasoning are all
# alive at their original vendor on days Azure has already stopped serving
# them, so every artifact here sets require_context: it is only reported in a
# file that names Azure. Telling someone who calls Anthropic directly that
# their model died on Azure's date would be a wrong answer with a citation
# attached, which is worse than no answer.
#
# Three deliberate exclusions:
#   - Models Azure lists as GA. Azure sets a retirement date programmatically
#     at launch for every GA model, 18 months out, so a date alone is not a
#     deprecation and reporting one would flag every current model.
#   - Names whose versions disagree. gpt-4o retires 2026-10-01 on version
#     2024-05-13 and 2027-04-14 on two others; sora-2, gpt-chat-latest,
#     model-router and the transcribe models are the same shape. The bare
#     string in someone's code does not say which version they deploy, so we
#     say nothing rather than guess.
#   - o1 and o3, on length. Two characters cannot be told apart from a
#     variable name, which is the same reason enum values under four
#     characters are dropped.
#
# claude-opus-4-1, o1-pro and gpt-image-1 are deliberately absent: Anthropic's
# and
# OpenAI's own manifests already carry them, and one finding per dead model is
# enough. Two artifacts sharing a literal put two different death dates on the
# same line, and the Azure SDK is imported from the `openai` package, so an
# Azure file satisfies both marker sets at once. build_feed.py now refuses a
# feed where two providers claim the same literal.
context:
  file_markers:
    - azure
    - AZURE_OPENAI
    - openai.azure.com
    - azure-ai
    - AZURE_AI

