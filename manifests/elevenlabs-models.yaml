    kind: model_id
    match:
      literals: ["eleven_monolingual_v1"]
    status: retired
    retires_on: 2026-07-09
    announced_on: 2026-06-08
    replacement: eleven_multilingual_v2
    severity: warning
    note: Removed 2026-07-09, announced 2026-06-08.
    evidence: https://elevenlabs.io/docs/changelog/2026/6/8

