# ElevenLabs announced on 2026-06-08 that the v1 speech models would be
# removed on 2026-07-09, and they were: "The eleven_monolingual_v1 and
# eleven_multilingual_v1 models are deprecated and will be removed on July 9,
# 2026." scribe_v1 was removed the same day. The turbo v2 line is deprecated
# on the models page with no removal date, so it carries none.
context:
  file_markers:
    - elevenlabs
    - ELEVENLABS_API_KEY
    - ELEVEN_API_KEY
    - api.elevenlabs.io
    - xi-api-key

