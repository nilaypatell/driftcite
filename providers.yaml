# Every provider driftcite tracks.
#
# Adding one is a change to this file, not to code. If a provider publishes a
# versioned OpenAPI spec in a public git repository, four lines here is the
# whole integration, and a pull request adding one is welcome.
#
#   repo     the public git repository holding the spec
#   path     path to the spec inside it (.json or .yaml; the other is tried too)
#   markers  strings that must appear somewhere in a file before non-model
#            artifacts from this provider count as findings there. Without this
#            a retired parameter named "refund" would flag every codebase that
#            has ever mentioned a refund.
#
# markers matter more than they look. They are the difference between a tool
# people leave switched on and one they mute in a week.

providers:
  stripe:
    repo: stripe/openapi
    path: openapi/spec3.json
    markers: [stripe, STRIPE_SECRET, STRIPE_API]

  github:
    repo: github/rest-api-description
    path: descriptions/api.github.com/api.github.com.json
    markers: [github, octokit, GITHUB_TOKEN]

  openai:
    repo: openai/openai-openapi
    path: openapi.json
    markers: [openai, OPENAI_API_KEY, "gpt-"]

  cloudflare:
    repo: cloudflare/api-schemas
    path: openapi.json
    markers: [cloudflare, CLOUDFLARE_API, CF_API]

  twilio:
    repo: twilio/twilio-oai
    path: spec/json/twilio_api_v2010.json
    markers: [twilio, TWILIO_ACCOUNT_SID, TWILIO_AUTH]

  digitalocean:
    repo: digitalocean/openapi
    path: specification/DigitalOcean-public.v2.yaml
    markers: [digitalocean, DIGITALOCEAN_TOKEN, "api.digitalocean.com"]

  box:
    repo: box/box-openapi
    path: openapi.json
    markers: [box, BOX_CLIENT_ID, "api.box.com"]
    # Box's only git tag is legacy-swagger-2.0, years behind main, so following
    # tags would pin us to a museum piece. Follow the spec's commits instead.
    track: commits

# Providers whose changes are not in a machine-readable spec are curated by
# hand in manifests/<name>.yaml instead. Model retirements are the usual case:
# they are published as prose in documentation and never appear in the spec.

# Live model-list endpoints, probed daily by scanner/probe_models.py.
#
# A curated manifest says a model was retired because a page said so. The
# probe says it because we sent the request and the ID was gone. Both are
# recorded; the second cannot be regenerated later by anyone who was not
# watching. A provider with no key in the environment is skipped by name,
# never silently.
#
#   url       the provider's list-models endpoint
#   auth      bearer | x-api-key | query-key   (how the key is presented)
#   key_env   environment variables tried in order for the key
#   id_path   where model IDs live in the response: data.id or models.name
#   strip     optional prefix removed from each ID (Google returns models/...)
model_lists:
  openai:
    url: https://api.openai.com/v1/models
    auth: bearer
    key_env: [OPENAI_API_KEY]
    id_path: data.id
  anthropic:
    url: https://api.anthropic.com/v1/models
    auth: x-api-key
    key_env: [ANTHROPIC_API_KEY]
    id_path: data.id
  google:
    url: https://generativelanguage.googleapis.com/v1beta/models
    auth: query-key
    key_env: [GEMINI_API_KEY, GOOGLE_API_KEY]
    id_path: models.name
    strip: models/
  groq:
    url: https://api.groq.com/openai/v1/models
    auth: bearer
    key_env: [GROQ_API_KEY]
    id_path: data.id
  mistral:
    url: https://api.mistral.ai/v1/models
    auth: bearer
    key_env: [MISTRAL_API_KEY]
    id_path: data.id
  xai:
    url: https://api.x.ai/v1/models
    auth: bearer
    key_env: [XAI_API_KEY]
    id_path: data.id
