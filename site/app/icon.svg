<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="driftcite">
  <!--
    The site icon: the mark on a plate, inset.

    The mark itself is drawn full-bleed on purpose — see .github/mark.svg,
    where that is right, because GitHub's app badge shrinks the whole square
    into a circle and supplies its own margin. Every surface here does the
    opposite. A tab favicon, an iOS home screen tile, a Google result tile
    and an iMessage preview all place the image edge to edge, so a full-bleed
    drawing arrives as a shape jammed into a square with nothing around it —
    which is exactly how it shipped, and what a link preview was showing.

    So the plate is the icon and the mark is inset to 64% of it. White rather
    than the site's #FBFCFE ground: a hair of off-white beside true white in a
    browser tab strip reads as a rendering fault, not as a colour.

    Generated sizes come from this file — run scripts/generate-icons.mjs
    after changing it, or the PNGs and this drawing will disagree.
  -->
  <rect width="512" height="512" rx="114" fill="#FFFFFF"/>
  <g transform="translate(92 92) scale(2.928571)">
    <g transform="scale(1.12 1)">
      <polygon fill="#3D5AFE" points="10,0 72,0 100,28 100,55 74,55 74,40 60,26 34,26 34,55 10,55"/>
      <polygon fill="#0D1220" points="0,57 24,57 24,86 50,86 64,72 64,57 90,57 90,84 62,112 0,112"/>
    </g>
  </g>
</svg>
